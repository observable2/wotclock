<!doctype html>
<notebook theme="stark">
  <title>wotclock</title>
  <script id="1" type="text/html">
    <style>
      /* the stage is the 780x530 window of the original QuickTime movie, scaled to fit */
      #wotclock { position: relative; margin: 0 auto; overflow: hidden; background: #000; }
      #stage { position: absolute; left: 0; top: 0; width: 780px; height: 530px; transform-origin: 0 0; background: #000;
        font-family: Monaco, "Spline Sans Mono", ui-monospace, Menlo, monospace; font-weight: bold; font-size: 22px; color: #fff; }
      #stage .view { position: absolute; overflow: hidden; touch-action: none; cursor: grab; }
      #stage .view.dragging { cursor: grabbing; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #stage #pauls { left: 0; top: 0; width: 780px; height: 120px; z-index: 50; }
      #stage #pauls img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #stage #scene, #stage #whisper { left: 0; top: 120px; width: 780px; height: 410px; }
      #stage #ring, #stage #hands { position: absolute; pointer-events: none; z-index: 200; }
      #stage #ring { left: 190px; top: 124px; width: 480px; height: 400px; }
      #stage #ring div { position: absolute; width: 40px; height: 40px; line-height: 40px; text-align: center; text-shadow: 0 0 3px #000; }
      #stage #hands { left: 215px; top: 272px; width: 430px; height: 96px; display: flex; flex-direction: column; justify-content: center; text-align: center; line-height: 1.5; white-space: pre; text-shadow: 0 0 3px #000, 0 0 6px #000; }
      #stage .red { color: #f00; }
    </style>
    <div id="wotclock">
      <div id="stage">
        <div class="view" id="whisper"><canvas></canvas></div>
        <div class="view" id="scene"><canvas></canvas></div>
        <div class="view" id="pauls"><canvas></canvas><img alt=""></div>
        <div id="ring"></div>
        <div id="hands"></div>
      </div>
    </div>
  </script>
  <script id="2" type="module">
    // wotclock, 2005 / 2026: a QuickTime 'speaking clock', recreated from the original movie's structure.
    // See tools/extract.py (media) and data/clock.js (the decoded 'mainspring' script).
    await new Promise((resolve) => requestAnimationFrame(resolve));

    const { STAGE, DIAL, nodeIndex, handsFile, handsEntry, dialIndex, redToHTML, createMainspring, IDLE_HZ, IDLE_DEGREES } = await import("./data/clock.js");
    const { Panorama } = await import("./data/panorama.js");

    const panos = await FileAttachment("./data/panos.json").json();
    const hands = await FileAttachment("./data/hands.json").json();
    const files = {
      overlay: FileAttachment("./data/pauls-overlay.png"),
      pauls: FileAttachment("./data/pano/pauls.jpg"),
      whisper: [
        FileAttachment("./data/pano/whisper-01.jpg"),
        FileAttachment("./data/pano/whisper-02.jpg"),
        FileAttachment("./data/pano/whisper-03.jpg"),
        FileAttachment("./data/pano/whisper-04.jpg"),
        FileAttachment("./data/pano/whisper-05.jpg"),
        FileAttachment("./data/pano/whisper-06.jpg"),
        FileAttachment("./data/pano/whisper-07.jpg"),
        FileAttachment("./data/pano/whisper-08.jpg"),
        FileAttachment("./data/pano/whisper-09.jpg"),
        FileAttachment("./data/pano/whisper-10.jpg"),
        FileAttachment("./data/pano/whisper-11.jpg"),
        FileAttachment("./data/pano/whisper-12.jpg"),
        FileAttachment("./data/pano/whisper-13.jpg"),
        FileAttachment("./data/pano/whisper-14.jpg"),
        FileAttachment("./data/pano/whisper-15.jpg"),
        FileAttachment("./data/pano/whisper-16.jpg"),
        FileAttachment("./data/pano/whisper-17.jpg"),
        FileAttachment("./data/pano/whisper-18.jpg"),
        FileAttachment("./data/pano/whisper-19.jpg"),
        FileAttachment("./data/pano/whisper-20.jpg"),
        FileAttachment("./data/pano/whisper-21.jpg"),
        FileAttachment("./data/pano/whisper-22.jpg"),
        FileAttachment("./data/pano/whisper-23.jpg"),
        FileAttachment("./data/pano/whisper-24.jpg")
      ],
      scene: [
        FileAttachment("./data/pano/scene-01.jpg"),
        FileAttachment("./data/pano/scene-02.jpg"),
        FileAttachment("./data/pano/scene-03.jpg"),
        FileAttachment("./data/pano/scene-04.jpg"),
        FileAttachment("./data/pano/scene-05.jpg"),
        FileAttachment("./data/pano/scene-06.jpg"),
        FileAttachment("./data/pano/scene-07.jpg"),
        FileAttachment("./data/pano/scene-08.jpg"),
        FileAttachment("./data/pano/scene-09.jpg"),
        FileAttachment("./data/pano/scene-10.jpg"),
        FileAttachment("./data/pano/scene-11.jpg"),
        FileAttachment("./data/pano/scene-12.jpg"),
        FileAttachment("./data/pano/scene-13.jpg"),
        FileAttachment("./data/pano/scene-14.jpg"),
        FileAttachment("./data/pano/scene-15.jpg"),
        FileAttachment("./data/pano/scene-16.jpg"),
        FileAttachment("./data/pano/scene-17.jpg"),
        FileAttachment("./data/pano/scene-18.jpg"),
        FileAttachment("./data/pano/scene-19.jpg"),
        FileAttachment("./data/pano/scene-20.jpg"),
        FileAttachment("./data/pano/scene-21.jpg"),
        FileAttachment("./data/pano/scene-22.jpg"),
        FileAttachment("./data/pano/scene-23.jpg"),
        FileAttachment("./data/pano/scene-24.jpg")
      ],
    };

    const wrapper = document.getElementById("wotclock");
    const stage = document.getElementById("stage");
    // The scenes are shown close to 1:1 (0.7-1.0x of source pixels), so they use a sharper mip bias than the St Paul's strip (0.4x).
    // The 2002 sources are soft, so the scenes also get an unsharp mask; ?sharpen=N overrides its strength (0 = off).
    const sharpenParam = new URLSearchParams(location.search).get("sharpen");
    const SCENE_SHARPEN = sharpenParam === null ? 1.2 : Number(sharpenParam);
    const view = (id, w, h, lodBias, sharpen = 0) => {
      const el = document.getElementById(id);
      return { el, pano: new Panorama(el.querySelector("canvas"), { cssWidth: w, cssHeight: h, lodBias, sharpen }) };
    };
    const pauls = view("pauls", STAGE.pauls.w, STAGE.pauls.h, 0);
    const scene = view("scene", STAGE.scene.w, STAGE.scene.h, -0.75, SCENE_SHARPEN);
    const whisper = view("whisper", STAGE.scene.w, STAGE.scene.h, -0.75, SCENE_SHARPEN);
    pauls.el.querySelector("img").src = await files.overlay.url();

    // fit the stage to the window
    let scale = 1;
    const fit = () => {
      scale = Math.min(window.innerWidth / STAGE.width, window.innerHeight / STAGE.height) * 0.98;
      stage.style.transform = `scale(${scale})`;
      wrapper.style.width = `${STAGE.width * scale}px`;
      wrapper.style.height = `${STAGE.height * scale}px`;
      const k = Math.min(3, scale * (window.devicePixelRatio || 1));
      for (const v of [pauls, scene, whisper]) v.pano.resize(k);
    };
    window.addEventListener("resize", fit);
    fit();

    // the letter dial and the phrase
    const ring = document.getElementById("ring");
    const cells = DIAL.cells.map((c) => {
      const d = ring.appendChild(document.createElement("div"));
      d.textContent = c.text;
      d.style.left = `${c.x}px`;
      d.style.top = `${c.y}px`;
      return d;
    });
    const handsEl = document.getElementById("hands");

    // dragging; the St Paul's panorama always returns to the time, the scenes carry on from where they were left
    const dragging = new Set();
    for (const v of [pauls, scene, whisper]) {
      let last;
      v.el.addEventListener("pointerdown", (e) => {
        last = e;
        v.el.setPointerCapture(e.pointerId);
        v.el.classList.add("dragging");
        dragging.add(v);
      });
      v.el.addEventListener("pointermove", (e) => {
        if (!dragging.has(v)) return;
        v.pano.drag((e.clientX - last.clientX) / scale, (e.clientY - last.clientY) / scale);
        last = e;
      });
      const up = () => {
        dragging.delete(v);
        v.el.classList.remove("dragging");
      };
      v.el.addEventListener("pointerup", up);
      v.el.addEventListener("pointercancel", up);
    }

    // ?time=HH:MM:SS starts the clock at that time of day (for looking at particular scenes)
    // ?still stops the scenes turning (for comparing renderings)
    const still = new URLSearchParams(location.search).has("still");
    const fake = new URLSearchParams(location.search).get("time");
    const offset = fake ? (() => { const [h, m, s = 0] = fake.split(":").map(Number); const t = new Date(); t.setHours(h, m, s, 0); return t - Date.now(); })() : 0;
    const now = () => new Date(Date.now() + offset);

    let paulsTarget = 0;
    let lastDial = -1;
    let lastHands = "";
    const mainspring = createMainspring({
      act: {
        async loadScenes(hour) {
          const i = nodeIndex(hour);
          await Promise.all([
            scene.pano.show(panos.scene[i], await files.scene[i].url()),
            whisper.pano.show(panos.whisper[i], await files.whisper[i].url()),
          ]);
        },
        async preload(hour) {
          const i = nodeIndex(hour);
          await Promise.all([scene.pano.load(await files.scene[i].url()), whisper.pano.load(await files.whisper[i].url())]);
        },
        setPauls(pan) { paulsTarget = pan; },
        restartFace() { lastDial = -1; },
        setLayers(s, w) {
          scene.el.style.zIndex = 100 - s;
          whisper.el.style.zIndex = 100 - w;
        },
        showHands(h, m, s) {
          const key = `${h}:${handsEntry(m, s)}`;
          if (key === lastHands) return;
          lastHands = key;
          handsEl.innerHTML = hands[handsFile(h)][handsEntry(m, s)].map((l) => `<div>${redToHTML(l)}</div>`).join("");
        },
      },
    });
    // initial layers: scene (5) in front of whisper (9)
    scene.el.style.zIndex = 100 - 5;
    whisper.el.style.zIndex = 100 - 9;
    await pauls.pano.show(panos.pauls, await files.pauls.url());
    await mainspring.init(now());

    let prev = performance.now();
    const shortest = (from, to) => ((to - from + 540) % 360) - 180;
    function frame(t) {
      const dt = Math.min(0.1, (t - prev) / 1000);
      prev = t;
      const d = now();
      mainspring.tick(d);
      // pauls: follows the time, easing back after a drag
      if (!dragging.has(pauls)) {
        const diff = shortest(pauls.pano.pan, paulsTarget);
        pauls.pano.setPan(Math.abs(diff) < 0.01 ? paulsTarget : pauls.pano.pan + diff * Math.min(1, dt * 8));
      }
      // scenes: slow turn, as the idle handler of every node
      if (!still) for (const v of [scene, whisper]) if (!dragging.has(v)) v.pano.setPan(v.pano.pan + IDLE_HZ * IDLE_DEGREES * dt);
      // second hand
      const di = dialIndex(d.getSeconds());
      if (di !== lastDial) {
        cells.forEach((c, i) => c.classList.toggle("red", i === di));
        lastDial = di;
      }
      for (const v of [pauls, scene, whisper]) v.pano.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</notebook>
